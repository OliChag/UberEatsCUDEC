<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOli - Pedidos</title>

  <link rel="stylesheet" href="../css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="manifest" href="../manifest.json">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <link rel="icon" type="image/png" href="../iconos/icon-192x192.png">

  <style>
    .card {
      border-radius: 12px;
      margin-top: 30px;
    }

    .btn.orange {
      background: #ff8c1a !important;
    }

    .input-field input:focus,
    .input-field textarea:focus {
      border-bottom: 1px solid #ff8c1a !important;
      box-shadow: 0 1px 0 0 #ff8c1a !important;
    }

    .input-field input:focus + label,
    .input-field textarea:focus + label {
      color: #ff8c1a !important;
    }

    .map-card {
      width: min(880px, 92%);
      margin: 28px auto 35px;
      padding: 8px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
    }

    #map {
      width: 100%;
      height: 280px;
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body class="grey lighten-4">

  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="../">Food<span>Oli</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">FOODOLI</a></li>
    <li><a href="../index.html" class="waves-effect">Home</a></li>
    <li><a href="../pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="../pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><div class="divider"></div></li>
    <li>
      <a href="../pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contacto
      </a>
    </li>
  </ul>

  <main class="container grey-text">
    <form id="formPedido">
      <div class="card">
        <div class="card-content">
          <span class="card-title center" style="font-size: 2rem;">
            Registro de Pedido
          </span>

          <div class="input-field">
            <select id="listaPlatillo" name="listaPlatillo" required>
              <option value="" disabled selected>Seleccione un platillo</option>
            </select>
            <label>Platillo</label>
          </div>

          <div class="input-field">
            <input type="text" id="nombre" name="nombre" required>
            <label for="nombre">Nombre</label>
          </div>

          <div class="input-field">
            <textarea
              id="direccion"
              name="direccion"
              class="materialize-textarea"
              required
            ></textarea>
            <label for="direccion">Dirección</label>
          </div>

          <div class="center" style="margin-top: 30px;">
            <button
              class="btn orange waves-effect waves-light"
              id="btnGuardar"
              type="submit"
            >
              <i class="material-icons left">save</i>
              Guardar
            </button>

            <button
              class="btn grey waves-effect waves-light"
              id="btnCancelar"
              type="reset"
            >
              <i class="material-icons left">cancel</i>
              Cancelar
            </button>
          </div>
        </div>
      </div>
    </form>

    <button
      class="btn orange waves-effect waves-light"
      id="btnDireccion"
      type="button"
    >
      <i class="material-icons left">search</i>
      Encontrar Dirección
    </button>

    <div class="map-card">
      <div id="map"></div>
    </div>

    <div class="qr qr-card center-align">
      <i class="material-icons qr-icon">qr_code_2</i>
      <span class="qr-title">Platillo solicitado</span>
      <p id="nombreQR"></p>
      <div id="qrcode"></div>
    </div>
  </main>

  <script src="../js/materialize.min.js"></script>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="../js/firebase.js"></script>
  <script src="../js/qrcode.min.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
