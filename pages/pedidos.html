<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>FoodOli - Pedidos</title>

  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>

  <style>
    .card{
      border-radius:12px;
      margin-top:30px;
    }

    .btn.orange{
      background:#ff8c1a !important;
    }

    .input-field input:focus,
    .input-field textarea:focus{
      border-bottom:1px solid #ff8c1a !important;
      box-shadow:0 1px 0 0 #ff8c1a !important;
    }

    .input-field input:focus + label,
    .input-field textarea:focus + label{
      color:#ff8c1a !important;
    }
  </style>
</head>

<body class="grey lighten-4">

  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">Food<span>Oli</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">FOODOLI</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><div class="divider"></div></li>
    <li>
      <a href="/pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contact
      </a>
    </li>
  </ul>

  <!-- content -->
  <div class="container grey-text">

    <div class="card">
      <div class="card-content">

        <span class="card-title center" style="font-size:2rem;">
          Registro de Pedido
        </span>

        <div class="input-field">
                    <select id="listaPlatillo" type="text">
                      <option value="" disabled selected>Seleccione un platillo</option>
                    </select>
                    <label for="platillo">Platillo</label>
                </div>


        <div class="input-field">
          <input type="text" id="nombre">
          <label for="nombre">Nombre</label>
        </div>

        <div class="input-field">
          <textarea id="direccion" class="materialize-textarea"></textarea>
          <label for="direccion">Dirección</label>
        </div>

        <div class="center" style="margin-top:30px;">
          <button class="btn orange waves-effect waves-light">
            <i class="material-icons left">save</i>
            Guardar
          </button>

          <button class="btn grey waves-effect waves-light">
            <i class="material-icons left">cancel</i>
            Cancelar
          </button>
        </div>

      </div>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      var sidenav = document.querySelectorAll('.sidenav');
      M.Sidenav.init(sidenav);

      var selects = document.querySelectorAll('select');
      M.FormSelect.init(selects);

    });
  </script>
 
 <script src="/js/firebase.js"></script>
 <script src="/js/pedidos.js"></script>
<script src="/js/db.js"></script>
<script src="/js/index.js"></script>

</body>
</html>
