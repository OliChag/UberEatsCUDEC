<body class="grey lighten-4">

  <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">

      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">

    <form id="formPedido">

      <div class="card-content">

        <span class="card-title center" style="font-size:2rem;">

        </span>

        <div class="input-field">

                    </select>
                    <label for="platillo">Platillo</label>
                </div>


        <div class="input-field">
          <input type="text" id="nombre">
          <label for="nombre">Nombre</label>
        </div>

        <div class="input-field">
          <textarea id="direccion" class="materialize-textarea"></textarea>
          <label for="direccion">Dirección</label>
        </div>

        <div class="center" style="margin-top:30px;">
          <button class="btn orange waves-effect waves-light" id="btnGuardar">
            <i class="material-icons left">save</i>
            Guardar
          </button>

          <button class="btn grey waves-effect waves-light" id="btnCancelar">

  </div>

        </div>

      </div>

</form>

 <button class="btn orange waves-effect waves-light" id="btnDireccion">

          </button>
          <div id="map"></div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      var sidenav = document.querySelectorAll('.sidenav');
      M.Sidenav.init(sidenav);

      var selects = document.querySelectorAll('select');
      M.FormSelect.init(selects);

    });
  </script>
