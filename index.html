<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodOli</title>

  <link rel="stylesheet" href="css/materialize.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/png" href="iconos/icon-192x192.png">
</head>

<body class="grey lighten-4">

  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="index.html">Food<span>Oli</span></a>

      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">
          menu
        </i>
      </span>
    </div>
  </nav>

  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">FOODOLI</a></li>
    <li><a href="index.html" class="waves-effect">Inicio</a></li>
    <li><a href="pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><div class="divider"></div></li>
    <li>
      <a href="pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contacto
      </a>
    </li>
  </ul>

  <main>
    <div class="recipes container grey-text text-darken-1"></div>

    <div class="center">
      <a
        class="btn-floating btn-small btn-large add-btn sidenav-trigger"
        data-target="side-form"
      >
        <i class="material-icons">add</i>
      </a>
    </div>
  </main>

  <div id="side-form" class="sidenav side-form">

    <form class="add-recipe container section" id="platillonuevo">
      <h6>Nuevo platillo</h6>
      <div class="divider"></div>

      <div class="input-field">
        <input
          placeholder="Ejemplo: Pizza"
          id="nombre"
          type="text"
          class="validate"
          required
        >
        <label for="nombre">Nombre</label>
      </div>

      <div class="input-field">
        <input
          placeholder="Ejemplo: 80"
          id="precio"
          type="number"
          min="0"
          step="0.01"
          class="validate"
          required
        >
        <label for="precio">Precio</label>
      </div>

      <div class="input-field">
        <input
          placeholder="Ejemplo: Queso, salsa, jamón"
          id="ingredientes"
          type="text"
          class="validate"
          required
        >
        <label for="ingredientes">Ingredientes</label>
      </div>

      <!-- Aquí se guarda la foto en Base64 para Firebase -->
      <input type="hidden" id="fotoBase64">

      <div class="input-field center">
        <button type="submit" class="btn-small waves-effect waves-light">
          <i class="material-icons left">add</i>
          Agregar
        </button>
      </div>
    </form>

    <button id="btnFoto" type="button" class="btn-small waves-effect waves-light">
      <i class="material-icons left">image</i>
      Imagen
    </button>

    <button
      type="button"
      id="btnTomarFoto"
      class="btn-small waves-effect waves-light"
    >
      <i class="material-icons left">camera_alt</i>
      Tomar foto
    </button>

    <div id="camara">
      <video id="video" autoplay playsinline muted>
        No hay video disponible.
      </video>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <div id="salida" class="camera-actions">
      <img
        id="foto"
        src=""
        alt="Foto del platillo"
        style="display: none;"
      >
    </div>
  </div>

  <script src="js/materialize.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/index.js"></script>
  <script src="js/db.js"></script>

  <script>
    if (typeof navigator.serviceWorker !== "undefined") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
